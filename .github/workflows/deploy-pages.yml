name: Build and deploy Vite to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Regression tests
        run: npm test
      - name: Type check
        run: npm run lint
      - name: Build production assets
        run: npm run build
      - name: Install browser for interaction checks
        run: npx playwright install --with-deps chromium
      - name: Browser interaction checks
        run: npm run test:e2e
      - name: Save browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: test-results/
          if-no-files-found: ignore
      - name: Include custom domain
        run: cp CNAME dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy compiled site
        id: deployment
        uses: actions/deploy-pages@v4

